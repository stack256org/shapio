# Shapio built from your local source, with PostgreSQL included.
#
#   git clone https://github.com/stack256org/shapio && cd shapio
#   cp .env.docker.example .env      # set APP_SECRET and NEXT_PUBLIC_APP_URL
#   docker compose -f docker-compose.build.yml up -d
#
# Most people do NOT want this file. It compiles both the app and worker images
# on your machine, which on a small server is slow and memory-hungry. Use plain
# docker-compose.yml instead, which pulls the images already published by
# .github/workflows/release.yml.
#
# The main reason to build is that you changed the code.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shapio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shapio}
      POSTGRES_DB: ${POSTGRES_DB:-shapio}
      # Pinned explicitly — the official Postgres image's default data
      # directory changed in Postgres 18. See the long comment in
      # docker-compose.yml.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shapio} -d ${POSTGRES_DB:-shapio}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Runs as root for a fraction of a second, purely to hand the uploads volume to
  # the unprivileged `shapio` user (uid/gid 1001) the app/worker images run as.
  # See the long comment in docker-compose.yml — same reasoning applies here.
  init-uploads:
    image: alpine:3
    user: "0:0"
    command: >
      sh -c "chown -R 1001:1001 /app/public/uploads &&
             echo 'uploads volume ownership set to uid/gid 1001'"
    volumes:
      - uploads:/app/public/uploads
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["/app/node_modules/.bin/tsx", "scripts/migrate.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      init-uploads:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # Published to the host so a fresh `docker compose up -d` is reachable at
    # localhost:3000 with no extra steps. Behind a reverse proxy (Dokploy,
    # Traefik, Caddy) that reaches the app over the Docker network instead,
    # drop this and use `expose: ["3000"]` to avoid the redundant host bind.
    ports:
      - "${APP_PORT:-3000}:3000"
    # Belt and braces: pin the internal port so a stray PORT in .env can never
    # move it. `environment:` wins over `env_file:` in Compose.
    environment:
      PORT: 3000
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      init-uploads:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The image ships its own HEALTHCHECK (GET /api/health) — no need to
    # redeclare it here.

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["/app/node_modules/.bin/tsx", "scripts/worker.ts"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      init-uploads:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  # Pinned to literal names — see the long comment in docker-compose.yml. Same
  # names as that file, so switching between building-from-source and pulling
  # a prebuilt image keeps the same data.
  pgdata:
    name: shapio_pgdata
  uploads:
    name: shapio_uploads
