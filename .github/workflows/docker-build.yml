name: Docker build sanity check

# Build-only — no push, no registry credentials needed. Confirms the
# self-hosted Docker path (Dockerfile, Dockerfile.worker, docker-compose.yml)
# keeps working as the app code changes, since nothing else in CI exercises it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 emulation — self-hosters on Apple Silicon / arm64 servers need
      # the image to actually build there too, not just on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # docker-compose.yml's app/worker/migrate services declare `env_file:
      # .env` explicitly — compose treats a missing *explicit* env_file as a
      # hard error. .env is gitignored, so a fresh CI checkout never has one;
      # this is a structural validation step only, so a placeholder is enough.
      - name: Create placeholder .env for compose validation
        run: cp .env.example .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
